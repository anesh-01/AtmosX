<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Stormy Deep Atmospheric Background Gradient -->
    <linearGradient id="skyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B27" />
      <stop offset="50%" stop-color="#162536" />
      <stop offset="100%" stop-color="#1E3347" />
    </linearGradient>

    <!-- Warm Golden Sun Gradient -->
    <linearGradient id="sunGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="40%" stop-color="#FDB813" />
      <stop offset="100%" stop-color="#F57C00" />
    </linearGradient>

    <!-- Soft Cloud Gradient with Atmospheric Depth -->
    <linearGradient id="cloudGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81D4FA" />
      <stop offset="100%" stop-color="#29B6F6" />
    </linearGradient>

    <!-- Soft Drop Shadows and Halos -->
    <filter id="sunHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cloudElev" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#070E16" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Weather Horizon Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#skyBg)" stroke="rgba(180, 205, 225, 0.16)" stroke-width="3" />

  <!-- Sun Rays and Disc -->
  <g transform="translate(195, 120)">
    <circle cx="95" cy="95" r="92" fill="#FDB813" opacity="0.18" filter="url(#sunHalo)" />
    <circle cx="95" cy="95" r="76" fill="url(#sunGrad)" filter="url(#sunHalo)" />
  </g>

  <!-- Weather Cumulus Cloud Structure -->
  <g filter="url(#cloudElev)">
    <path d="M165 315 H355 A62 62 0 0 0 417 253 A62 62 0 0 0 355 191 A94 94 0 0 0 178 180 A74 74 0 0 0 102 246 A70 70 0 0 0 165 315 Z" fill="url(#cloudGrad)" />
    <path d="M106 250 A74 74 0 0 1 180 184 A94 94 0 0 1 353 194 A62 62 0 0 1 414 254" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Atmospheric Rain Streamers -->
  <g transform="translate(0, 340)">
    <path d="M175 0 L155 46 A10 10 0 0 0 173 52 L193 6 A10 10 0 0 0 175 0 Z" fill="url(#rainGrad)" opacity="0.9" />
    <path d="M235 8 L215 54 A10 10 0 0 0 233 60 L253 14 A10 10 0 0 0 235 8 Z" fill="url(#rainGrad)" opacity="0.95" />
    <path d="M295 0 L275 46 A10 10 0 0 0 293 52 L313 6 A10 10 0 0 0 295 0 Z" fill="url(#rainGrad)" opacity="0.9" />
    <path d="M355 10 L337 48 A9 9 0 0 0 353 53 L371 15 A9 9 0 0 0 355 10 Z" fill="url(#rainGrad)" opacity="0.8" />
  </g>
</svg>